system:
  host: 0.0.0.0
  port: 16181
  http_client_timeout: 30
  web_ui: true
  detail_concurrency: 10
  batch_workers: 24  # 流式批量并发IP数（实测24并发≈19q/s且0硬429）
  ip_query_concurrency: 1  # 同一IP并发查询数（实测必须为1，防突发限流）
  ip_query_interval: 0.5  # 同一IP查询发送间隔（秒，实测0.5s安全）
  token_query_cap: 60  # 每个IP独立token窗口内最多查询条数
  ip_queries_per_rotation: 15  # 同一IP在窗口内连续查询条数后轮换IP
  max_requeue_attempts: 10  # 单个域名被限流后的最大延迟重试次数（指数退避）
  enable_stream_batch: true  # 多IP流式批量（共享token窗口 + 多IP轮换，429自动换IP）
captcha:
  enable: true
  save_failed_img: false
  save_failed_img_path: faile_captcha
  retry_times: 2
  max_per_token: 60  # per-captcha query window (reuse token longer to reduce auth bottleneck)
  queries_per_ip: 20  # 每个worker每批拉取域名数（实测批次大小）
proxy:
  local_ipv6_pool:
    enable: true
    pool_num: 300
    check_interval: 1
    ipv6_network_card: 以太网
  tunnel:
    url: null
  extra_api:
    url: null
    extra_interval: 3
    timeout: 100
    timeout_drop: 8
    check_proxy: true
    proxy_timeout: 0.5
    check_proxy_num: 20
    auto_maintenace: true
    pool_num: 100
risk_avoidance:
  allow_type:
  - web
  - app
  - mapp
  - kapp
  - bweb
  - bapp
  - bmapp
  - bkapp
  prohibit_suffix: []
log:
  dir: logs
  file_head: ymicp
  backup_count: 7
  save_log: true
  output_console: true
history:
  save_query_history: true
auth:
  enable: false
  secret: change-me
  session_hours: 72
  users:
  - username: admin
    password: sha256$240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9
mcp:
  enable: false
  port: 16182
