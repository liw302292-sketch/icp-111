system:
  host: 0.0.0.0
  port: 16181
  http_client_timeout: 30
  web_ui: true
  detail_concurrency: 10
  batch_workers: 24  # 回到验证过的稳定档；加并发会让新/64的403被放大
  ip_query_concurrency: 1  # 每IP串行，避免挑战页被并发触发
  ip_query_interval: 0.6  # 每IP间隔，性能基线定档（0.5~0.6 为最优，0.6 资源效率更高）
  token_query_cap: 60  # 每个IP独立token窗口内最多查询条数
  ip_queries_per_rotation: 15  # 同一IP在窗口内连续查询条数后轮换IP
  max_requeue_attempts: 3  # 单个域名被限流后的最大延迟重试次数（降低重试风暴）
  enable_stream_batch: true  # 多IP流式批量（共享token窗口 + 多IP轮换，429自动换IP）
  shared_token_batch: false  # 单IP独立token；共享token实测不提升反而更慢
  shared_queries_per_ip: 30  # 共享模式下每IP查询数（低于WAF硬化阈值，保留备用）
captcha:
  enable: true
  save_failed_img: false
  save_failed_img_path: faile_captcha
  retry_times: 2
  max_per_token: 60  # per-captcha query window (reuse token longer to reduce auth bottleneck)
  queries_per_ip: 20  # 每个worker每批拉取域名数（实测批次大小）
proxy:
  local_ipv6_pool:
    enable: true
    pool_num: 300
    check_interval: 1
    ipv6_network_card: 以太网
  tunnel:
    url: null
  extra_api:
    url: null
    extra_interval: 3
    timeout: 100
    timeout_drop: 8
    check_proxy: true
    proxy_timeout: 0.5
    check_proxy_num: 20
    auto_maintenace: true
    pool_num: 100
risk_avoidance:
  allow_type:
  - web
  - app
  - mapp
  - kapp
  - bweb
  - bapp
  - bmapp
  - bkapp
  prohibit_suffix: []
log:
  dir: logs
  file_head: ymicp
  backup_count: 7
  save_log: true
  output_console: true
history:
  save_query_history: true
auth:
  enable: false
  secret: change-me
  session_hours: 72
  users:
  - username: admin
    password: sha256$240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9
mcp:
  enable: false
  port: 16182
